<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Grid</title>
    <style>

        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        div.container {
            width: 100vw;
            height: 100vh;
            display: grid;
            border: solid 1px black;
            grid-template: 80px 40px 1fr 100px 40px / repeat(2, 1fr);
            grid-auto-columns: 1fr;
        }

        div.topo {
            background-color: green;
            grid-area: 1 / 1 / 2 / 4;
            text-align: center;
        }

        div.menu {
            background-color: red;
            grid-area: 2 / 1 / 3 / 4;
            text-align: center;
        }

        div.principal {
            background-color: blue;
            grid-area: 3 / 1 / 5 / 3;
            text-align: center;
        }

        div.secundario {
            background-color: yellow;
            grid-area: 3 / 3 / 5 / 4;
            text-align: center;
        }

        div.rodape {
            background-color: gray;
            grid-area: 5 / 1 / 6 / 4;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="topo"><p>topo</p></div>
        <div class="menu"><p>menu</p></div>
        <div class="principal"><p>principal</p></div>
        <div class="secundario"><p>secundario</p></div>
        <div class="rodape"><p>rodape</p></div>
    </div>
</body>
</html>
