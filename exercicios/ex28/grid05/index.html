<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>

        div.container {
            display: grid;
            border: 1px solid blue;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
        }

        div.caixa01 {
            background-color: blue;

            grid-area: 1 / 1 / 4 / 3;
        }

        div.caixa02 {
            background-color: red;

            grid-row: 1 / 2;
            grid-column: 3 / 5;
        }

        div.caixa03 {
            background-color: green;

            grid-area: 2 / 3 / 4 / 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa01"><p>Caixa 01</p></div>
        <div class="caixa02"><p>Caixa 02</p></div>
        <div class="caixa03"><p>Caixa 03</p></div>
    </div>
</body>
</html>
