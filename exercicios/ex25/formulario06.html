<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post">

        <fieldset>
            <legend>Meu perfil</legend>
            <p>
                <label for="icor">Selecione a cor de fundo:</label>
                <input type="color" name="cor" id="icor" value="#0000ff">
            </p>
            <p>
                <label for="irange">Nível de Safistação do app:</label>
                <input type="range" name="range" id="irange" min="1" max="10" value="5">
            </p>
            <p>
                <label for="ifile">Selecione uma foto de perfil:</label>
                <input type="file" name="file" id="ifile">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
