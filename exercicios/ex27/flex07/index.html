<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            display: flex;
            height: 400px;
            flex-flow: row wrap;
            align-content: flex-start;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        #i1 {
            order: 0;
        }
        #i2 {
            order: 15;
        }
        #i3 {
            order: -6;
        }
        #i4 {
            order: 10;
        }
        #i5 {
            order: -2;
        }
        #i6 {
            order: 0;
        }
        #i7 {
            order: -1;
        }
        #i8 {
            order: 4;
        }
        #i9 {
            order: 8;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
        <div class="item" id="i9">I</div>
    </div>
</body>
</html>
